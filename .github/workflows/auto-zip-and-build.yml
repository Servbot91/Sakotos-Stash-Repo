name: Auto Zip Plugin Folders and Update Manifest

on:
  push:
    paths:
      - 'plugins/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  zip-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Debug - List plugin directories
        run: |
          echo "Plugin directories:"
          ls -la plugins/
          echo "Ascension:"
          ls -la plugins/Ascension/plugins/ || echo "Ascension dir not found"
          echo "Deck Viewer:"
          ls -la "plugins/Deck Viewer/plugins/" || echo "Deck Viewer dir not found"

      - name: Create/Update Zip Files
        run: |
          # Ascension
          if [ -d "plugins/Ascension/plugins/Ascension" ]; then
            cd plugins/Ascension/plugins
            rm -f Ascension.zip
            zip -r Ascension.zip Ascension
            echo "Created Ascension.zip"
            ls -la Ascension.zip
            cd ../../../..
          fi
          
          # Deck Viewer
          if [ -d "plugins/Deck Viewer/plugins/Deck Viewer" ]; then
            cd "plugins/Deck Viewer/plugins"
            rm -f "Deck Viewer.zip"
            zip -r "Deck Viewer.zip" "Deck Viewer"
            echo "Created Deck Viewer.zip"
            ls -la "Deck Viewer.zip"
            cd ../../../..
          fi
          
          # DiceR
          if [ -d "plugins/DiceR/plugins/DiceR" ]; then
            cd plugins/DiceR/plugins
            rm -f DiceR.zip
            zip -r DiceR.zip DiceR
            echo "Created DiceR.zip"
            ls -la DiceR.zip
            cd ../../../..
          fi
          
          # Senpai Addon Pack
          if [ -d "plugins/Senpai Stash Addon/plugins/senpai-addon-pack" ]; then
            cd "plugins/Senpai Stash Addon/plugins"
            rm -f senpai-addon-pack.zip
            zip -r senpai-addon-pack.zip senpai-addon-pack
            echo "Created senpai-addon-pack.zip"
            ls -la senpai-addon-pack.zip
            cd ../../../..
          fi
          
          # Senpai Theme
          if [ -d "plugins/Senpai Stash Theme/plugins/SenpaiV1" ]; then
            cd "plugins/Senpai Stash Theme/plugins"
            rm -f SenpaiV1.zip
            zip -r SenpaiV1.zip SenpaiV1
            echo "Created SenpaiV1.zip"
            ls -la SenpaiV1.zip
            cd ../../../..
          fi
          
          # TagImagesFromGalleries
          if [ -d "plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries" ]; then
            cd plugins/TagImagesFromGalleries/plugins
            rm -f tagImagesFromGalleries.zip
            zip -r tagImagesFromGalleries.zip tagImagesFromGalleries
            echo "Created tagImagesFromGalleries.zip"
            ls -la tagImagesFromGalleries.zip
            cd ../../../..
          fi

      - name: Debug - Check zip files
        run: |
          echo "Checking for zip files:"
          find plugins/ -name "*.zip" -type f

      - name: Update manifest with SHA256 hashes
        run: |
          python .github/scripts/update_manifest.py

      - name: Commit and push updated files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git status
          git commit -m "Auto-update zip files and manifest" || echo "No changes to commit"
          git push
