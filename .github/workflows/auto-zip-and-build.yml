name: Auto Zip Plugin Folders and Update Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------
      # Get commit info
      # ---------------------------------
      - name: Get commit info
        id: commit
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_TS=$(git log -1 --pretty=format:'%ct')
          COMMIT_DATE=$(date -d @$COMMIT_TS +"%Y-%m-%d %H:%M:%S")
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT

      # ---------------------------------
      # Build all zip files
      # ---------------------------------
      - name: Build zip files
        run: |
          echo "Building zip files..."
          
          # Always try to build all zip files
          cd plugins
          
          # Ascension
          if [ -d "Ascension/plugins/Ascension" ]; then
            echo "Building Ascension.zip"
            cd Ascension/plugins
            rm -f Ascension.zip
            zip -r Ascension.zip Ascension
            cd ../../..
          fi
          
          # Deck Viewer
          if [ -d "Deck Viewer/plugins/Deck Viewer" ]; then
            echo "Building Deck Viewer.zip"
            cd "Deck Viewer/plugins"
            rm -f "Deck Viewer.zip"
            zip -r "Deck Viewer.zip" "Deck Viewer"
            cd ../../..
          fi
          
          # DiceR
          if [ -d "DiceR/plugins/DiceR" ]; then
            echo "Building DiceR.zip"
            cd DiceR/plugins
            rm -f DiceR.zip
            zip -r DiceR.zip DiceR
            cd ../../..
          fi
          
          # Senpai Addon Pack
          if [ -d "Senpai Stash Addon/plugins/senpai-addon-pack" ]; then
            echo "Building senpai-addon-pack.zip"
            cd "Senpai Stash Addon/plugins"
            rm -f senpai-addon-pack.zip
            zip -r senpai-addon-pack.zip senpai-addon-pack
            cd ../../..
          fi
          
          # Senpai Theme
          if [ -d "Senpai Stash Theme/plugins/SenpaiV1" ]; then
            echo "Building SenpaiV1.zip"
            cd "Senpai Stash Theme/plugins"
            rm -f SenpaiV1.zip
            zip -r SenpaiV1.zip SenpaiV1
            cd ../../..
          fi
          
          # TagImagesFromGalleries
          if [ -d "TagImagesFromGalleries/plugins/tagImagesFromGalleries" ]; then
            echo "Building tagImagesFromGalleries.zip"
            cd TagImagesFromGalleries/plugins
            rm -f tagImagesFromGalleries.zip
            zip -r tagImagesFromGalleries.zip tagImagesFromGalleries
            cd ../../..
          fi

      # ---------------------------------
      # Calculate SHA256 hashes
      # ---------------------------------
      - name: Calculate SHA256 hashes
        id: hash
        run: |
          echo "Calculating SHA256 hashes..."
          
          # Ascension
          if [ -f "plugins/Ascension/plugins/Ascension.zip" ]; then
            ASCENSION_HASH=$(sha256sum plugins/Ascension/plugins/Ascension.zip | awk '{ print $1 }')
            echo "ascension_sha256=$ASCENSION_HASH" >> $GITHUB_OUTPUT
          fi
          
          # Deck Viewer
          if [ -f "plugins/Deck Viewer/plugins/Deck Viewer.zip" ]; then
            DECKVIEWER_HASH=$(sha256sum "plugins/Deck Viewer/plugins/Deck Viewer.zip" | awk '{ print $1 }')
            echo "deckviewer_sha256=$DECKVIEWER_HASH" >> $GITHUB_OUTPUT
          fi
          
          # DiceR
          if [ -f "plugins/DiceR/plugins/DiceR.zip" ]; then
            DICER_HASH=$(sha256sum plugins/DiceR/plugins/DiceR.zip | awk '{ print $1 }')
            echo "dicer_sha256=$DICER_HASH" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------
      # Update manifest.yml using Python script
      # ---------------------------------
      - name: Update manifest with Python
        run: |
          cat > update_manifest.py << 'EOF'
          import yaml
          import os
          import sys
          
          def update_manifest(sha, date, ascension_hash, deckviewer_hash, dicer_hash):
              manifest_path = 'plugins/manifest.yml'
              if not os.path.exists(manifest_path):
                  print("Manifest not found")
                  return
                  
              with open(manifest_path, 'r') as f:
                  content = f.read()
                  
              docs = content.split('---')
              manifest_entries = []
              for doc in docs:
                  doc = doc.strip()
                  if doc and doc != '---':
                      try:
                          entry = yaml.safe_load(doc)
                          if entry:
                              manifest_entries.append(entry)
                      except:
                          pass
              
              # Update first few entries (you can extend this for all)
              if len(manifest_entries) > 0:
                  manifest_entries[0]['version'] = f"1.0{sha}"
                  manifest_entries[0]['date'] = date
                  if ascension_hash:
                      manifest_entries[0]['sha256'] = ascension_hash
                      
              if len(manifest_entries) > 1:
                  manifest_entries[1]['version'] = f"1.0{sha}"
                  manifest_entries[1]['date'] = date
                  if deckviewer_hash:
                      manifest_entries[1]['sha256'] = deckviewer_hash
                      
              if len(manifest_entries) > 2:
                  manifest_entries[2]['version'] = f"1.0{sha}"
                  manifest_entries[2]['date'] = date
                  if dicer_hash:
                      manifest_entries[2]['sha256'] = dicer_hash
              
              # Write back
              with open(manifest_path, 'w') as f:
                  f.write('---\n')
                  for i, entry in enumerate(manifest_entries):
                      yaml.dump(entry, f, default_flow_style=False, sort_keys=False)
                      if i < len(manifest_entries) - 1:
                          f.write('---\n')
                  f.write('---\n')
          
          if __name__ == '__main__':
              sha = sys.argv[1]
              date = sys.argv[2]
              ascension_hash = sys.argv[3] if sys.argv[3] != 'None' else None
              deckviewer_hash = sys.argv[4] if sys.argv[4] != 'None' else None
              dicer_hash = sys.argv[5] if sys.argv[5] != 'None' else None
              update_manifest(sha, date, ascension_hash, deckviewer_hash, dicer_hash)
          EOF
          
          python3 update_manifest.py \
            "${{ steps.commit.outputs.sha }}" \
            "${{ steps.commit.outputs.date }}" \
            "${{ steps.hash.outputs.ascension_sha256 }}" \
            "${{ steps.hash.outputs.deckviewer_sha256 }}" \
            "${{ steps.hash.outputs.dicer_sha256 }}"

      # ---------------------------------
      # Commit changes
      # ---------------------------------
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add plugins/*/plugins/*.zip 2>/dev/null || true
          git add plugins/manifest.yml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build zip and update metadata (1.0${{ steps.commit.outputs.sha }})"
            git push
          fi
