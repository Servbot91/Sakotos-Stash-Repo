name: Build Plugins and Update Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/Ascension/plugins/Ascension/**'
      - 'plugins/Deck Viewer/plugins/Deck Viewer/**'
      - 'plugins/DiceR/plugins/DiceR/**'
      - 'plugins/Senpai Stash Addon/plugins/senpai-addon-pack/**'
      - 'plugins/Senpai Stash Theme/plugins/SenpaiV1/**'
      - 'plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Get Changed Files
      id: changed-files
      uses: tj-actions/changed-files@v44

    - name: Process, Zip, and Update YAML Manifest
      run: |
        # Current Timestamp formatted like your manifest: YYYY-MM-DD HH:MM:SS
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S")
        MANIFEST_PATH="plugins/manifest.yml"
        
        # Array schema: "TriggerPath|ZipDestinationFolder|ZipFileName|SourceFolderToZip|ManifestID"
        PLUGINS=(
          "plugins/Ascension/plugins/Ascension/|plugins/Ascension/plugins|Ascension.zip|plugins/Ascension/plugins/Ascension|Ascension"
          "plugins/Deck Viewer/plugins/Deck Viewer/|plugins/Deck Viewer/plugins|Deck Viewer.zip|plugins/Deck Viewer/plugins/Deck Viewer|DeckViewer"
          "plugins/DiceR/plugins/DiceR/|plugins/DiceR/plugins|DiceR.zip|plugins/DiceR/plugins/DiceR|DiceR"
          "plugins/Senpai Stash Addon/plugins/senpai-addon-pack/|plugins/Senpai Stash Addon/plugins|senpai-addon-pack.zip|plugins/Senpai Stash Addon/plugins/senpai-addon-pack|SenpaiAddonPack"
          "plugins/Senpai Stash Theme/plugins/SenpaiV1/|plugins/Senpai Stash Theme/plugins|SenpaiV1.zip|plugins/Senpai Stash Theme/plugins/SenpaiV1|SenpaiTheme"
          "plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries/|plugins/TagImagesFromGalleries/plugins|tagImagesFromGalleries.zip|plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries|TagImagesFromGalleries"
        )

        UPDATED_ANY=false

        for plugin in "${PLUGINS[@]}"; do
          IFS="|" read -r TRIGGER DEST_DIR ZIP_NAME SRC_DIR MANIFEST_ID <<< "$plugin"
          
          # Check if changes happened in this plugin's watched folder
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" == "$TRIGGER"* ]]; then
              echo "Changes detected for ID: $MANIFEST_ID. Rebuilding zip..."
              
              # Ensure output directory exists
              mkdir -p "$DEST_DIR"
              TARGET_ZIP="$PWD/$DEST_DIR/$ZIP_NAME"
              
              # Pack the folder contents (not the parent folder structure)
              cd "$SRC_DIR"
              zip -r "$TARGET_ZIP" ./*
              cd - > /dev/null
              
              # Calculate SHA256 of the freshly built zip file
              SHA256_HASH=$(sha256sum "$DEST_DIR/$ZIP_NAME" | awk '{print $1}')
              
              # Optional: Try to automatically read the version inside plugin.yml if it exists
              VERSION="1.0.0"
              if [ -f "$SRC_DIR/plugin.yml" ]; then
                EXTRACTED_VER=$(yq '.version // empty' "$SRC_DIR/plugin.yml")
                if [ ! -z "$EXTRACTED_VER" ]; then
                  VERSION=$EXTRACTED_VER
                fi
              fi
              
              # Update plugins/manifest.yml fields via yq using the matching ID block
              if [ -f "$MANIFEST_PATH" ]; then
                yq -i "(.[] | select(.id == \"$MANIFEST_ID\")).sha256 = \"$SHA256_HASH\"" "$MANIFEST_PATH"
                yq -i "(.[] | select(.id == \"$MANIFEST_ID\")).date = \"$TIMESTAMP\"" "$MANIFEST_PATH"
                
                # Only overwrite version if we managed to dynamically fetch it from a plugin.yml
                if [ "$VERSION" != "1.0.0" ]; then
                  yq -i "(.[] | select(.id == \"$MANIFEST_ID\")).version = \"$VERSION\"" "$MANIFEST_PATH"
                fi
              fi
              
              UPDATED_ANY=true
              break 
            fi
          done
        done
        
        echo "UPDATED_ANY=$UPDATED_ANY" >> $GITHUB_ENV

    - name: Commit and Push Changes
      if: env.UPDATED_ANY == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add plugins/
        
        if ! git diff --cached --quiet; then
          git commit -m "chore: automated zip rebuild & manifest.yml update [skip ci]"
          git push
        else
          echo "No distinct changes found to commit."
        fi
