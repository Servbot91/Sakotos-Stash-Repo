name: Auto Zip Plugin Folders and Update Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------
      # Get commit info
      # ---------------------------------
      - name: Get commit info
        id: commit
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_TS=$(git log -1 --pretty=format:'%ct')
          COMMIT_DATE=$(date -d @$COMMIT_TS +"%Y-%m-%d %H:%M:%S")
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT

      # ---------------------------------
      # Build zip files when source folders change
      # ---------------------------------
      - name: Build Ascension.zip
        if: contains(github.event.head_commit.added, 'plugins/Ascension/plugins/Ascension/') || contains(github.event.head_commit.modified, 'plugins/Ascension/plugins/Ascension/') || contains(github.event.head_commit.removed, 'plugins/Ascension/plugins/Ascension/')
        run: |
          echo "Building Ascension.zip"
          cd plugins/Ascension/plugins
          rm -f Ascension.zip
          zip -r Ascension.zip Ascension

      - name: Build Deck Viewer.zip
        if: contains(github.event.head_commit.added, 'plugins/Deck Viewer/plugins/Deck Viewer/') || contains(github.event.head_commit.modified, 'plugins/Deck Viewer/plugins/Deck Viewer/') || contains(github.event.head_commit.removed, 'plugins/Deck Viewer/plugins/Deck Viewer/')
        run: |
          echo "Building Deck Viewer.zip"
          cd "plugins/Deck Viewer/plugins"
          rm -f "Deck Viewer.zip"
          zip -r "Deck Viewer.zip" "Deck Viewer"

      - name: Build DiceR.zip
        if: contains(github.event.head_commit.added, 'plugins/DiceR/plugins/DiceR/') || contains(github.event.head_commit.modified, 'plugins/DiceR/plugins/DiceR/') || contains(github.event.head_commit.removed, 'plugins/DiceR/plugins/DiceR/')
        run: |
          echo "Building DiceR.zip"
          cd plugins/DiceR/plugins
          rm -f DiceR.zip
          zip -r DiceR.zip DiceR

      - name: Build Senpai Addon Pack.zip
        if: contains(github.event.head_commit.added, 'plugins/Senpai Stash Addon/plugins/senpai-addon-pack/') || contains(github.event.head_commit.modified, 'plugins/Senpai Stash Addon/plugins/senpai-addon-pack/') || contains(github.event.head_commit.removed, 'plugins/Senpai Stash Addon/plugins/senpai-addon-pack/')
        run: |
          echo "Building senpai-addon-pack.zip"
          cd "plugins/Senpai Stash Addon/plugins"
          rm -f senpai-addon-pack.zip
          zip -r senpai-addon-pack.zip senpai-addon-pack

      - name: Build Senpai Theme.zip
        if: contains(github.event.head_commit.added, 'plugins/Senpai Stash Theme/plugins/SenpaiV1/') || contains(github.event.head_commit.modified, 'plugins/Senpai Stash Theme/plugins/SenpaiV1/') || contains(github.event.head_commit.removed, 'plugins/Senpai Stash Theme/plugins/SenpaiV1/')
        run: |
          echo "Building SenpaiV1.zip"
          cd "plugins/Senpai Stash Theme/plugins"
          rm -f SenpaiV1.zip
          zip -r SenpaiV1.zip SenpaiV1

      - name: Build TagImagesFromGalleries.zip
        if: contains(github.event.head_commit.added, 'plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries/') || contains(github.event.head_commit.modified, 'plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries/') || contains(github.event.head_commit.removed, 'plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries/')
        run: |
          echo "Building tagImagesFromGalleries.zip"
          cd plugins/TagImagesFromGalleries/plugins
          rm -f tagImagesFromGalleries.zip
          zip -r tagImagesFromGalleries.zip tagImagesFromGalleries

      # ---------------------------------
      # Calculate SHA256 of zip files that were created
      # ---------------------------------
      - name: Calculate SHA256 hashes
        id: hash
        run: |
          echo "Calculating SHA256 hashes..."
          
          # Ascension
          if [ -f "plugins/Ascension/plugins/Ascension.zip" ]; then
            HASH=$(sha256sum plugins/Ascension/plugins/Ascension.zip | awk '{ print $1 }')
            echo "ascension_sha256=$HASH" >> $GITHUB_OUTPUT
          fi
          
          # Deck Viewer
          if [ -f "plugins/Deck Viewer/plugins/Deck Viewer.zip" ]; then
            HASH=$(sha256sum "plugins/Deck Viewer/plugins/Deck Viewer.zip" | awk '{ print $1 }')
            echo "deckviewer_sha256=$HASH" >> $GITHUB_OUTPUT
          fi
          
          # DiceR
          if [ -f "plugins/DiceR/plugins/DiceR.zip" ]; then
            HASH=$(sha256sum plugins/DiceR/plugins/DiceR.zip | awk '{ print $1 }')
            echo "dicer_sha256=$HASH" >> $GITHUB_OUTPUT
          fi
          
          # Senpai Addon Pack
          if [ -f "plugins/Senpai Stash Addon/plugins/senpai-addon-pack.zip" ]; then
            HASH=$(sha256sum "plugins/Senpai Stash Addon/plugins/senpai-addon-pack.zip" | awk '{ print $1 }')
            echo "senpaiaddon_sha256=$HASH" >> $GITHUB_OUTPUT
          fi
          
          # Senpai Theme
          if [ -f "plugins/Senpai Stash Theme/plugins/SenpaiV1.zip" ]; then
            HASH=$(sha256sum "plugins/Senpai Stash Theme/plugins/SenpaiV1.zip" | awk '{ print $1 }')
            echo "senpaitheme_sha256=$HASH" >> $GITHUB_OUTPUT
          fi
          
          # TagImagesFromGalleries
          if [ -f "plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries.zip" ]; then
            HASH=$(sha256sum plugins/TagImagesFromGalleries/plugins/tagImagesFromGalleries.zip | awk '{ print $1 }')
            echo "tagimages_sha256=$HASH" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------
      # Update manifest.yml
      # ---------------------------------
      - name: Update manifest.yml
        run: |
          FILE="plugins/manifest.yml"
          
          # Update entries only if their zip was built
          # Ascension
          if [ -n "${{ steps.hash.outputs.ascension_sha256 }}" ]; then
            awk '/id: Ascension/{c++} c==1 && /version:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/version:.*/version: 1.0${{ steps.commit.outputs.sha }}/" $FILE
            awk '/id: Ascension/{c++} c==1 && /date:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/date:.*/date: ${{ steps.commit.outputs.date }}/" $FILE
            awk '/id: Ascension/{c++} c==1 && /sha256:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/sha256:.*/sha256: ${{ steps.hash.outputs.ascension_sha256 }}/" $FILE
          fi
          
          # Deck Viewer
          if [ -n "${{ steps.hash.outputs.deckviewer_sha256 }}" ]; then
            awk '/id: DeckViewer/{c++} c==1 && /version:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/version:.*/version: 1.0${{ steps.commit.outputs.sha }}/" $FILE
            awk '/id: DeckViewer/{c++} c==1 && /date:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/date:.*/date: ${{ steps.commit.outputs.date }}/" $FILE
            awk '/id: DeckViewer/{c++} c==1 && /sha256:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/sha256:.*/sha256: ${{ steps.hash.outputs.deckviewer_sha256 }}/" $FILE
          fi
          
          # DiceR
          if [ -n "${{ steps.hash.outputs.dicer_sha256 }}" ]; then
            awk '/id: DiceR/{c++} c==1 && /version:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/version:.*/version: 1.0${{ steps.commit.outputs.sha }}/" $FILE
            awk '/id: DiceR/{c++} c==1 && /date:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/date:.*/date: ${{ steps.commit.outputs.date }}/" $FILE
            awk '/id: DiceR/{c++} c==1 && /sha256:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/sha256:.*/sha256: ${{ steps.hash.outputs.dicer_sha256 }}/" $FILE
          fi
          
          # Senpai Addon Pack
          if [ -n "${{ steps.hash.outputs.senpaiaddon_sha256 }}" ]; then
            awk '/id: SenpaiAddonPack/{c++} c==1 && /version:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/version:.*/version: 1.0${{ steps.commit.outputs.sha }}/" $FILE
            awk '/id: SenpaiAddonPack/{c++} c==1 && /date:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/date:.*/date: ${{ steps.commit.outputs.date }}/" $FILE
            awk '/id: SenpaiAddonPack/{c++} c==1 && /sha256:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/sha256:.*/sha256: ${{ steps.hash.outputs.senpaiaddon_sha256 }}/" $FILE
          fi
          
          # Senpai Theme
          if [ -n "${{ steps.hash.outputs.senpaitheme_sha256 }}" ]; then
            awk '/id: SenpaiTheme/{c++} c==1 && /version:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/version:.*/version: 1.0${{ steps.commit.outputs.sha }}/" $FILE
            awk '/id: SenpaiTheme/{c++} c==1 && /date:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/date:.*/date: ${{ steps.commit.outputs.date }}/" $FILE
            awk '/id: SenpaiTheme/{c++} c==1 && /sha256:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/sha256:.*/sha256: ${{ steps.hash.outputs.senpaitheme_sha256 }}/" $FILE
          fi
          
          # TagImagesFromGalleries
          if [ -n "${{ steps.hash.outputs.tagimages_sha256 }}" ]; then
            awk '/id: TagImagesFromGalleries/{c++} c==1 && /version:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/version:.*/version: 1.0${{ steps.commit.outputs.sha }}/" $FILE
            awk '/id: TagImagesFromGalleries/{c++} c==1 && /date:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/date:.*/date: ${{ steps.commit.outputs.date }}/" $FILE
            awk '/id: TagImagesFromGalleries/{c++} c==1 && /sha256:/ {print NR; exit}' $FILE | xargs -I {} sed -i "{}s/sha256:.*/sha256: ${{ steps.hash.outputs.tagimages_sha256 }}/" $FILE
          fi

      # ---------------------------------
      # Commit changes
      # ---------------------------------
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add plugins/*/plugins/*.zip 2>/dev/null || true
          git add plugins/manifest.yml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build zip and update metadata (1.0${{ steps.commit.outputs.sha }})"
            git push
          fi
