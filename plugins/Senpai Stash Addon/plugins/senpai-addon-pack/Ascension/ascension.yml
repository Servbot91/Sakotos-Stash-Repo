name: Ascension
description: "A comprehensive comparison tool that adds a tier based rating system for stash entities. Features include real time dynamic and scaling matchmaking system, leaderboards, metrics, better UI, better mobile integration."
version: 1.2.6
url: 
exec:
  - python
  - "{pluginDir}/jumper.py"

ui: 
  javascript:
    - ascension.js
    - ascen-stats.js
  css:
    - ascension.css
  assets:
    /: snapshots
    
interface: raw

tasks:
  - name: "Prime Performer Ratings"
    description: Randomly assigns all performers a rating between 1 (F-Tier) up to 40 (C-Tier) honoring correct distribution.
    defaultArgs:
      mode: processAll
      task: prime

  - name: "Wipe Performer Match History"
    description: Deletes all Performer Ascension history from custom fields. 
    defaultArgs:
      mode: processAll
      task: wipe

  - name: "Reset All Performer Ratings"
    description: Resets all Performer ratings to 0. 
    defaultArgs:
      mode: processAll
      task: reset

  - name: "Snapshot"
    description: Writes all ratings, match history, and ledger to a json file. Example- DATE-TIME - Ascension Database Snapshot.json
    defaultArgs:
      mode: processAll
      task: snapshotexport
      
  - name: "Import Ascension Snapshot"
    description: Looks for for most recent snapshot and restores database.
    defaultArgs:
      mode: processAll
      task: snapshotimport

settings:
  HideAscRankBadge:
    displayName: Hide Ascension Rank Badge
    description: Hide the rank badge and restore default stash rating badges.
    type: BOOLEAN
    
