name: Ascension
description: "Ascension features a unique engine to function as a comprehensive stash entity rating and tier system that scales and adapts to your database in real time. This fork sets out to further expand and develop core features of the original while maintaining a consistent, fair, and stable rating system."
version: 1.3.5
url: https://discourse.stashapp.cc/t/ascension/6714
exec:
  - python
  - "{pluginDir}/asc_taskmaster.py"

ui: 
  javascript:
    - ascension.js
  css:
    - ascension.css
  assets:
    /: snapshots
    
interface: raw

tasks:
  - name: "Prime Performer Ratings"
    description: Randomly assigns all performers a rating between 1 (F-Tier) up to 40 (C-Tier) honoring correct distribution.
    defaultArgs:
      mode: processAll
      task: prime

  - name: "Wipe Performer Match History"
    description: Deletes all Performer Acension history from custom fields. 
    defaultArgs:
      mode: processAll
      task: wipe

  - name: "Reset All Performer Ratings"
    description: Resets all Performer ratings to 0. 
    defaultArgs:
      mode: processAll
      task: reset

  - name: "Wipe Scene Match History"
    description: Deletes all Scene Ascension history from custom fields.
    defaultArgs:
      mode: processAll
      task: scenewipe

  - name: "Reset All Scene Ratings"
    description: Resets all Scene ratings to null.
    defaultArgs:
      mode: processAll
      task: scenereset

  - name: "Snapshot"
    description: Writes all ratings, match history, and ledger to a json file. Example- DATE-TIME - Ascension Database Snapshot.json
    defaultArgs:
      mode: processAll
      task: snapshotexport
      
  - name: "Import Ascension Snapshot"
    description: Looks for for most recent snapshot and restores database.
    defaultArgs:
      mode: processAll
      task: snapshotimport
